# Rate limiting zone — 10MB shared memory, 10 requests per second per IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    # Raised to 120s so slow (CPU) LLM narrative calls have room to finish
    # before falling back; normal requests still return instantly.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /docs {
    proxy_pass http://api:8000/docs;
    proxy_set_header Host $host;
  }

  location /redoc {
    proxy_pass http://api:8000/redoc;
    proxy_set_header Host $host;
  }

  location /openapi.json {
    proxy_pass http://api:8000/openapi.json;
    proxy_set_header Host $host;
  }

  # Next.js hot-reload / static chunks
  location /_next/ {
    proxy_pass http://frontend:3000/_next/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Everything else -> Next.js frontend
  location / {
    proxy_pass http://frontend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
