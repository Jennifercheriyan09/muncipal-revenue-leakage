services:
  api:
    build:
      context: ./backend
    container_name: mrlis-final-api
    env_file:
      - path: .env
        required: false
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mrlis-final-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8082/api/v1
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  postgres:
    image: postgis/postgis:16-3.4
    container_name: mrlis-final-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-municipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-municipal}
      POSTGRES_DB: ${POSTGRES_DB:-municipal_revenue}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-municipal} -d ${POSTGRES_DB:-municipal_revenue}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  redis:
    image: redis:7.4-alpine
    container_name: mrlis-final-redis
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
               redis-server --requirepass $$REDIS_PASSWORD;
             else
               redis-server;
             fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: mrlis-final-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "6337:6333"
      - "6338:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  ollama:
    image: ollama/ollama:latest
    container_name: mrlis-final-ollama
    ports:
      - "11436:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"

  nginx:
    image: nginx:1.27-alpine
    container_name: mrlis-final-nginx
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
